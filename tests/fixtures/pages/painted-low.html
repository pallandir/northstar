<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Painted low</title>
<style>
body{margin:0;font:18px/1.6 system-ui;background:#fff}
section{position:relative;padding:72px 24px;min-height:240px}
.layer{position:absolute;inset:0;background:#111;pointer-events:none;z-index:0}
.content{position:relative;z-index:1;max-width:640px;color:#6b6b6b}
h1{font-size:44px;line-height:1.1;margin:0 0 16px}
</style></head><body><section><div class="layer"></div><div class="content"><h1>Painted behind</h1><p>The dark surface is a decorative layer that is neither an ancestor nor hit testable, so only the pixels know it is there.</p></div></section></body></html>
