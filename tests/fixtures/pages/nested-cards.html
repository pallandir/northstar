<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Nested cards</title>
<style>
body{margin:0;font:16px/1.5 system-ui;background:#f5f5f4;color:#1c1917;padding:48px}
.outer{max-width:640px;border-radius:16px;background:#fff;border:1px solid #d6d3d1;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:32px}
.inner{border-radius:12px;background:#fafaf9;border:1px solid #e7e5e4;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:24px;margin-top:16px}
h2{margin:0 0 8px}p{margin:0}
</style></head><body><div class="outer"><h2>Billing</h2><p>Manage your plan and invoices from one place.</p>
<div class="inner"><h2>Current plan</h2><p>Team plan, billed monthly at forty nine dollars.</p></div></div></body></html>
