- id: NS-LAYOUT-SPACING-RHYTHM
  title: Grouping through spacing
  stage: [compose, polish]
  severity: warn
  allowable: true
  detect: advisory
  rationale: Related items sit close, separate groups sit apart, and a heading has more space above than below it. Uniform spacing erases hierarchy.
  fix: Use the spacing scale from DESIGN.md and read the computed values on the page.
  sources: [impeccable]

- id: NS-LAYOUT-RESPONSIVE
  title: Works from 360px up
  stage: [compose, critique]
  severity: error
  allowable: false
  detect: dom
  rationale: The layout must hold from a narrow phone to a wide desktop without horizontal scrolling or clipped content, using real copy.
  fix: Use fluid widths, wrap rules and container queries, and test the real content at each breakpoint.
  sources: [impeccable, frontend-design, ui-ux-pro-max]

- id: NS-LAYOUT-STATES
  title: Every state is designed
  stage: [compose, critique]
  severity: warn
  modes: { operate: error }
  allowable: true
  detect: advisory
  rationale: Hover, focus, active, disabled, loading, empty and error states are part of the design, not afterthoughts.
  fix: Specify each state in the component entry of DESIGN.md and implement all of them.
  sources: [impeccable, ui-ux-pro-max, frontend-design]

- id: NS-LAYOUT-MODAL-OVERUSE
  title: Modal for a task that needs no interruption
  stage: [compose, critique]
  severity: info
  allowable: true
  detect: advisory
  rationale: A modal is for tasks that need protected focus or a decision. Inline editing, popovers and drawers are usually lighter.
  fix: Use an inline pattern or a popover unless the task truly blocks.
  sources: [impeccable]

- id: NS-LAYOUT-CENTER-EVERYTHING
  title: Everything centred
  stage: [compose, critique]
  severity: info
  modes: { experience: off }
  allowable: true
  detect: advisory
  rationale: Centring every block removes a reading edge. Choose an alignment per region on purpose.
  fix: Left align body content and reserve centring for short, single focus areas.
  sources: [top-design, frontend-design]

- id: NS-LAYOUT-FIRST-VIEW
  title: The first view shows the subject
  stage: [direction, compose, critique]
  severity: info
  modes: { operate: off, read: off }
  allowable: true
  detect: advisory
  rationale: The first view of a persuasive page should show the most characteristic thing in the subject's world in the form that suits it.
  fix: Lead with the product, a real image, a live demo or a statement only this brand could make.
  sources: [frontend-design, top-design]
