name: Publish MCP server to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - name: Check versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-versions.mjs --tag "${{ github.ref_name }}"
      - name: Check versions agree
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/check-versions.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run gen:check
      - run: npm run check:pack
      - run: npm publish --workspace @pallandir/northstar
